name: .NET

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    env:
      ProjectName: PasskeyPick

    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - targetPlatform: win-x64
          - targetPlatform: win-arm64

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@v6
        
    # The csproj declares RuntimeIdentifiers win-x64;win-arm64, so one locked-mode restore covers both RIDs.
    - name: Restore
      run: dotnet restore --locked-mode

    # framework-dependent single-file publish (tiny ~2 MB, like g-helper): csproj's PublishSingleFile conditional
    # group pins SelfContained=false, so only the app's managed code is bundled and the .NET Desktop Runtime is loaded
    # from the system. mwinapi's native helper is embedded via IncludeNativeLibrariesForSelfExtract, so the publish
    # is a single EXE.
    - name: Build
      run: dotnet build ${{ env.ProjectName }} --no-restore --runtime ${{ matrix.targetPlatform }} --configuration Release -p:PublishSingleFile=true

    - name: Publish
      run: dotnet publish ${{ env.ProjectName }} --no-build --runtime ${{ matrix.targetPlatform }} --configuration Release -p:PublishSingleFile=true

    # Per-architecture ZIP so the win-x64 and win-arm64 assets never collide on a release, matching the README's
    # "download the release ZIP archive" wording.
    - name: Package release asset
      shell: pwsh
      run: |
        $exe = "${{ env.ProjectName }}/bin/Release/net10.0-windows10.0.19041.0/${{ matrix.targetPlatform }}/publish/${{ env.ProjectName }}.exe"
        Compress-Archive -Path $exe -DestinationPath "${{ env.ProjectName }}-${{ matrix.targetPlatform }}.zip" -Force

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ProjectName }}-${{ matrix.targetPlatform }}
        path: ${{ env.ProjectName }}-${{ matrix.targetPlatform }}.zip
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*/*.zip
          generate_release_notes: true
