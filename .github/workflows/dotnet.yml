name: .NET

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    env:
      ProjectName: PasskeyPick

    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - targetPlatform: win-x64
          - targetPlatform: win-arm64

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        
    # The csproj declares RuntimeIdentifiers win-x64;win-arm64, so one locked-mode restore covers both RIDs.
    - name: Restore
      run: dotnet restore --locked-mode

    # Unit + loopback integration tests for the security core (PIN cache, priority rules, socket parsing, bridge relay).
    - name: Test
      run: dotnet test ${{ env.ProjectName }}.Tests --configuration Release

    # framework-dependent single-file publish (tiny ~2 MB, like g-helper): csproj's PublishSingleFile conditional
    # group pins SelfContained=false, so only the app's managed code is bundled and the .NET Desktop Runtime is loaded
    # from the system. All libraries are pure managed code, so the publish is a single EXE.
    - name: Build
      run: dotnet build ${{ env.ProjectName }} --no-restore --runtime ${{ matrix.targetPlatform }} --configuration Release -p:PublishSingleFile=true

    - name: Publish
      run: dotnet publish ${{ env.ProjectName }} --no-build --runtime ${{ matrix.targetPlatform }} --configuration Release -p:PublishSingleFile=true

    # Per-architecture EXE so the win-x64 and win-arm64 assets never collide on a release; no ZIP wrapper, users
    # download the EXE directly.
    - name: Prepare release asset
      shell: pwsh
      run: |
        $exe = "${{ env.ProjectName }}/bin/Release/net10.0-windows10.0.19041.0/${{ matrix.targetPlatform }}/publish/${{ env.ProjectName }}.exe"
        Copy-Item $exe "${{ env.ProjectName }}-${{ matrix.targetPlatform }}.exe" -Force

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.ProjectName }}-${{ matrix.targetPlatform }}
        path: ${{ env.ProjectName }}-${{ matrix.targetPlatform }}.exe
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*/*.exe
          generate_release_notes: true
